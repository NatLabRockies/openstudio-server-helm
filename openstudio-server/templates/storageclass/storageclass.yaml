{{- if not (lookup "storage.k8s.io/v1" "StorageClass" "" "ssd") }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ssd
{{ if eq .Values.provider.name "aws" }}
provisioner: kubernetes.io/aws-ebs
parameters:
  type: gp3
{{ end }}
{{ if eq .Values.provider.name "google" }}
provisioner: pd.csi.storage.gke.io
parameters:
  type: pd-ssd
  replication-type: none
{{ end }}
{{ if eq .Values.provider.name "azure" }}
provisioner: kubernetes.io/azure-disk
parameters:
  kind: Managed
  storageaccounttype: StandardSSD_LRS
{{ end }}
{{ if eq .Values.provider.name "openstack" }}
# The in-tree "kubernetes.io/cinder" provisioner was removed along with the
# in-tree cloud provider in Kubernetes 1.26+. Clusters provisioned by Azimuth
# (and any other modern OpenStack/Cluster API cluster) only ship the external
# Cinder CSI driver, so this must use its provisioner name instead.
provisioner: cinder.csi.openstack.org
{{ end }}
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
{{- end }}

{{- if eq .Values.provider.name "openstack" }}
{{- if not (lookup "storage.k8s.io/v1" "StorageClass" "" "hdd") }}
---
# Cinder "lagos_volume" volume type is the regular (HDD) tier. Used for bulk
# storage such as the NFS backend; the "ssd" class above is for everything else.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hdd
provisioner: cinder.csi.openstack.org
parameters:
  type: lagos_volume
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
{{- end }}
{{- end }}
