{{- /* Render unless an unrelated copy exists. If this release already owns it, it must keep
rendering, otherwise helm treats it as removed from the manifest and deletes it on upgrade. */ -}}
{{- $existing := lookup "scheduling.k8s.io/v1" "PriorityClass" "" "low-priority" -}}
{{- if or (not $existing) (and (eq (dig "metadata" "annotations" "meta.helm.sh/release-name" "" $existing) .Release.Name) (eq (dig "metadata" "annotations" "meta.helm.sh/release-namespace" "" $existing) .Release.Namespace)) }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: low-priority
value: 10000
globalDefault: true
description: "Used for non-core service pods only. This is default"
{{- end }}
