{{- /* Render unless an unrelated copy exists. If this release already owns it, it must keep
rendering, otherwise helm treats it as removed from the manifest and deletes it on upgrade. */ -}}
{{- $existing := lookup "scheduling.k8s.io/v1" "PriorityClass" "" "high-priority" -}}
{{- if or (not $existing) (eq (dig "metadata" "annotations" "meta.helm.sh/release-name" "" $existing) .Release.Name) }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high-priority
value: 1000000
globalDefault: false
description: "Used for core rails web service pods only."
{{- end }}