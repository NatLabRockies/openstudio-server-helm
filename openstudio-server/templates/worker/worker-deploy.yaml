apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.worker.name   }}
  labels:
    release: {{ .Release.Name }}
  annotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
spec:
  {{- if not .Values.worker_hpa.name }}
  replicas: {{ .Values.worker.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.worker.name }}
      release: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: {{ .Values.worker.name }}
        release: {{ .Release.Name }}
    spec:
      affinity:
        {{- include "openstudio.nodeGroupAffinity" (dict "root" . "role" "worker") | nindent 8 }}
      containers:
        - name: {{ .Values.worker.container.name   }}
          image: {{ include "openstudio.imageWithRegistry" (dict "root" $ "image" .Values.worker.container.image) | quote }}
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # Pre-stop cleanup. No dependency on NFS-mounted paths.
                    # Every command uses timeout and || true so D-state hangs
                    # cannot block terminationGracePeriodSeconds.
                    echo "Sending QUIT signal to Resque" >&2 || true
                    timeout 2 pkill -f -QUIT resque 2>/dev/null || true
                    echo "Waiting briefly for processes" >&2 || true
                    timeout 10 bash -c 'for i in $(seq 1 25); do [ $(pgrep -c ruby 2>/dev/null || echo 10) -le 1 ] && [ $(pgrep -c openstudio 2>/dev/null || echo 10) -le 0 ] && exit 0; sleep 2; done; exit 1' 2>/dev/null || echo "Timeout reached; forcing exit" >&2 || true
                    echo "Killing remaining processes" >&2 || true
                    timeout 2 pkill -P 1 2>/dev/null || true
                    echo "Pre-stop complete" >&2 || true
          resources:
            requests:
              cpu:  {{  .Values.worker.container.resources.requests.cpu  }}
              memory:  {{  .Values.worker.container.resources.requests.memory  }}
            {{- include "openstudio.resourceLimits" .Values.worker.container.resources.limits | nindent 12 }}
          volumeMounts:
            - name: osdata-worker
              mountPath: "/mnt/openstudio"
          env:
            - name:  QUEUES
              value: requeued,simulations
            - name:  COUNT
              value: "1"
            - name: SECRET_KEY_BASE
              value: {{ .Values.web.secret_key_value | quote }}
            - name: REDIS_URL
              value: {{ .Values.redis_svc.url | quote }}
            - name: MONGO_USER
              value: {{ .Values.db.username | quote }}
            - name: MONGO_PASSWORD
              value: {{ .Values.db.password | quote }}
          command: ["/usr/local/bin/start-workers"]
      terminationGracePeriodSeconds: {{ .Values.worker.container.terminationGracePeriodSeconds }} # for long openstudio jobs.
      priorityClassName: low-priority
      volumes:
        - name: osdata-worker
          {{- if .Values.worker.container.emptyDirSizeLimit }}
          emptyDir:
            sizeLimit: {{ .Values.worker.container.emptyDirSizeLimit }}
          {{- else }}
          emptyDir: {}
          {{- end }}
