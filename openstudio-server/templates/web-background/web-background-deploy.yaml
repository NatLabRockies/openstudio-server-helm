apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{  .Values.web_background.name  }}
  labels:
    release: {{ .Release.Name }}
spec:
  replicas: {{  .Values.web_background.replicas  }}
  selector:
    matchLabels:
      app: {{  .Values.web_background.name  }}
      release: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxSurge MUST stay 0 here. web_background.replicas is pinned to 1 by
      # an explicit openstudio-server developer constraint (only the worker
      # deployment may run >1 replica), but maxSurge: 1 quietly broke that
      # during every rollout: Kubernetes would start a second web-background
      # pod before terminating the old one, and since each pod boots
      # OS_SERVER_NUMBER_OF_WORKERS (150 in the openstack values) Resque
      # workers against the shared background/analyses queues, the two pods
      # would briefly run 300 workers and both pull from the same queues.
      # maxSurge: 0 makes the rollout terminate-then-create, which honours
      # the 1-replica invariant at the cost of a short gap in background
      # processing.
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: {{  .Values.web_background.name  }}
        release: {{ .Release.Name }}
    spec:
      affinity:
        {{- include "openstudio.nodeGroupAffinity" (dict "root" . "role" "web") | nindent 8 }}
      containers:
        - name:  {{  .Values.web_background.container.name  }}
          image: {{ include "openstudio.imageWithRegistry" (dict "root" $ "image" .Values.web_background.container.image) | quote }}
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu:  {{  .Values.web_background.container.resources.requests.cpu  }}
              memory:  {{  .Values.web_background.container.resources.requests.memory  }}
            {{- include "openstudio.resourceLimits" .Values.web_background.container.resources.limits | nindent 12 }}
          volumeMounts:
            - name: nfs
              mountPath: "/mnt/openstudio"
          env:
            - name: OS_SERVER_NUMBER_OF_WORKERS
              value: {{ .Values.web_background.number_of_workers | quote }}
            - name: QUEUES
              value: background,analyses
            - name: SECRET_KEY_BASE
              value: {{ .Values.web.secret_key_value | quote }}
            - name: REDIS_URL
              value: {{ .Values.redis_svc.url | quote }}
            - name: MONGO_USER
              value: {{ .Values.db.username | quote }}
            - name: MONGO_PASSWORD
              value: {{ .Values.db.password | quote }}
          command: ["/bin/bash", "-c", "cd /opt/openstudio/server && COUNT=${OS_SERVER_NUMBER_OF_WORKERS} bundle exec rake environment resque:workers"]
          livenessProbe:
            exec:
              command: ["grep", "-qs", "/mnt/openstudio ",  "/proc/mounts"]
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 3
      priorityClassName: high-priority
      terminationGracePeriodSeconds: 60
      volumes:
        - name: nfs
          persistentVolumeClaim:
            claimName: nfs-pvc
